name: deepseek-live

on:
  workflow_dispatch:
    inputs:
      confirm_paid_test:
        description: Confirm the paid 20-case DeepSeek NativeCard quality gate
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: deepseek-live
  cancel-in-progress: false

jobs:
  live:
    if: inputs.confirm_paid_test
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment: deepseek-live
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26.x'
          cache-dependency-path: services/cloud/go.sum
      - name: Run the paid NativeCard quality gate with DeepSeek
        working-directory: services/cloud
        shell: bash
        env:
          AGENTCARD_DEEPSEEK_LIVE: '1'
          AGENTCARD_MODEL_BASE_URL: https://api.deepseek.com
          AGENTCARD_MODEL: ${{ vars.AGENTCARD_MODEL }}
          AGENTCARD_MODEL_API_KEY: ${{ secrets.AGENTCARD_MODEL_API_KEY }}
        run: |
          test -n "$AGENTCARD_MODEL"
          test -n "$AGENTCARD_MODEL_API_KEY"
          go test ./internal/modelprovider \
            -run '^TestDeepSeekLiveNativeCardQualityGate$' \
            -count=1 \
            -timeout=35m \
            -v
