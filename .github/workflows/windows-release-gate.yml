name: windows-release-gate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/desktop/**'
      - 'packaging/windows/**'
      - '.github/workflows/windows-release-gate.yml'

permissions:
  contents: read

jobs:
  build-unsigned-structure:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Install pinned Flutter SDK
        shell: pwsh
        run: |
          git clone --filter=blob:none https://github.com/flutter/flutter.git C:\flutter
          git -C C:\flutter checkout edada7c56e
          'C:\flutter\bin' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Test and build desktop client
        working-directory: apps/desktop
        run: |
          flutter pub get
          flutter analyze
          flutter test
          flutter build windows --release
      - name: Build pinned native runtime dependencies
        shell: pwsh
        run: |
          git clone --filter=blob:none https://github.com/microsoft/vcpkg.git C:\vcpkg
          git -C C:\vcpkg checkout f87344cac03158cbf1467264565f1fd36b382a24
          C:\vcpkg\bootstrap-vcpkg.bat -disableMetrics
          C:\vcpkg\vcpkg.exe install libsodium:x64-windows sqlite3:x64-windows --disable-metrics
          $bundle = 'apps\desktop\build\windows\x64\runner\Release'
          Copy-Item C:\vcpkg\installed\x64-windows\bin\libsodium.dll $bundle
          Copy-Item C:\vcpkg\installed\x64-windows\bin\sqlite3.dll $bundle
      - name: Assert native release prerequisites are supplied
        shell: pwsh
        run: |
          pwsh packaging/windows/verify-release.ps1 -Bundle apps/desktop/build/windows/x64/runner/Release

# This workflow intentionally produces no publishable installer. A release job must
# supply approved x64 native DLLs, use protected signing credentials, run the verifier
# with -RequireSignature, build/sign the installer, and retain its verification JSON.
