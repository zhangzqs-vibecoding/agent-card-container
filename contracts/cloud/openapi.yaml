openapi: 3.1.0
info:
  title: Agent Card Cloud API
  version: 1.0.0
servers:
  - url: https://api.agentcard.example
security:
  - oidcBearer: []
paths:
  /healthz:
    get:
      security: []
      responses:
        "200":
          description: Service health
  /v1/generations:
    post:
      operationId: createGeneration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [prompt]
              properties:
                prompt: {type: string, minLength: 1}
                target: {enum: [auto, native, web], default: auto}
                locale: {type: string, default: zh-CN}
                baseCardId: {type: string, pattern: "^card_[A-Za-z0-9_-]+$"}
                baseVersionId: {type: string, pattern: "^ver_[A-Za-z0-9_-]+$"}
              dependentRequired:
                baseCardId: [baseVersionId]
                baseVersionId: [baseCardId]
      responses:
        "201":
          description: Generation awaiting confirmation
          content:
            application/json:
              schema: {$ref: "#/components/schemas/GenerationSession"}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
  /v1/generations/{id}:
    get:
      operationId: getGeneration
      parameters:
        - $ref: "#/components/parameters/GenerationID"
      responses:
        "200":
          description: Generation snapshot
          content:
            application/json:
              schema: {$ref: "#/components/schemas/GenerationSession"}
        "404": {$ref: "#/components/responses/Error"}
  /v1/generations/{id}/messages:
    post:
      operationId: addGenerationMessage
      parameters:
        - $ref: "#/components/parameters/GenerationID"
      responses:
        "200":
          description: Updated generation
          content:
            application/json:
              schema: {$ref: "#/components/schemas/GenerationSession"}
        "409": {$ref: "#/components/responses/Error"}
  /v1/generations/{id}/confirm:
    post:
      operationId: confirmGeneration
      parameters:
        - $ref: "#/components/parameters/GenerationID"
      responses:
        "200":
          description: Queued generation
          content:
            application/json:
              schema: {$ref: "#/components/schemas/GenerationSession"}
        "409": {$ref: "#/components/responses/Error"}
  /v1/generations/{id}/cancel:
    post:
      operationId: cancelGeneration
      parameters:
        - $ref: "#/components/parameters/GenerationID"
      responses:
        "200": {description: Cancelled generation}
  /v1/generations/{id}/events:
    get:
      operationId: streamGenerationEvents
      parameters:
        - $ref: "#/components/parameters/GenerationID"
        - in: header
          name: Last-Event-ID
          schema: {type: integer, minimum: 0}
      responses:
        "200":
          description: SSE stream using generation-event.schema.json
          content:
            text/event-stream: {}
  /v1/cards:
    get:
      operationId: listCards
      responses:
        "200": {description: User card list}
  /v1/cards/{cardId}:
    get:
      operationId: getCard
      parameters:
        - in: path
          name: cardId
          required: true
          schema: {type: string}
      responses:
        "200": {description: Card and immutable versions}
        "404": {$ref: "#/components/responses/Error"}
  /v1/cards/{cardId}/versions/{versionId}/artifact:
    get:
      operationId: getArtifactDownload
      parameters:
        - in: path
          name: cardId
          required: true
          schema: {type: string}
        - in: path
          name: versionId
          required: true
          schema: {type: string}
      responses:
        "200": {description: Short-lived artifact URL and signature metadata}
        "404": {$ref: "#/components/responses/Error"}
components:
  schemas:
    GenerationMessage:
      type: object
      additionalProperties: false
      required: [role, content, createdAt]
      properties:
        role: {type: string}
        content: {type: string}
        createdAt: {type: string, format: date-time}
    RequirementSnapshot:
      type: object
      additionalProperties: false
      required:
        - initialPrompt
        - additionalMessages
        - target
        - locale
        - allowedCapabilities
        - confirmedAt
      properties:
        initialPrompt: {type: string, minLength: 1}
        additionalMessages:
          type: array
          items: {$ref: "#/components/schemas/GenerationMessage"}
        target: {type: string, enum: [auto, native, web]}
        locale: {type: string, minLength: 1}
        baseCardId: {type: string, pattern: "^card_[A-Za-z0-9_-]+$"}
        baseVersionId: {type: string, pattern: "^ver_[A-Za-z0-9_-]+$"}
        allowedCapabilities:
          type: array
          uniqueItems: true
          items: {type: string, minLength: 1}
        confirmedAt: {type: string, format: date-time}
      dependentRequired:
        baseCardId: [baseVersionId]
        baseVersionId: [baseCardId]
    RequirementSummary:
      type: object
      additionalProperties: false
      required: [goal, constraints, locale]
      properties:
        goal: {type: string, minLength: 1}
        constraints:
          type: array
          items: {type: string}
        locale: {type: string, minLength: 1}
    GenerationSession:
      type: object
      additionalProperties: false
      required:
        - id
        - prompt
        - target
        - locale
        - status
        - summary
        - messages
        - createdAt
        - updatedAt
      properties:
        id: {type: string, pattern: "^gen_[A-Za-z0-9_-]+$"}
        prompt: {type: string, minLength: 1}
        target: {type: string, enum: [auto, native, web]}
        locale: {type: string, minLength: 1}
        baseCardId: {type: string, pattern: "^card_[A-Za-z0-9_-]+$"}
        baseVersionId: {type: string, pattern: "^ver_[A-Za-z0-9_-]+$"}
        status:
          type: string
          enum:
            - draft
            - awaiting_confirmation
            - queued
            - generating
            - validating
            - ready
            - failed
            - cancelled
        summary: {$ref: "#/components/schemas/RequirementSummary"}
        messages:
          type: array
          items: {$ref: "#/components/schemas/GenerationMessage"}
        confirmedRequirement: {$ref: "#/components/schemas/RequirementSnapshot"}
        versionId: {type: string}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
      dependentRequired:
        baseCardId: [baseVersionId]
        baseVersionId: [baseCardId]
  securitySchemes:
    oidcBearer:
      type: openIdConnect
      openIdConnectUrl: https://issuer.example/.well-known/openid-configuration
  parameters:
    GenerationID:
      in: path
      name: id
      required: true
      schema: {type: string, pattern: "^gen_[A-Za-z0-9_-]+$"}
  responses:
    Error:
      description: Stable error envelope
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [error]
            properties:
              error:
                type: object
                additionalProperties: false
                required: [code, message, requestId]
                properties:
                  code: {type: string}
                  message: {type: string}
                  requestId: {type: string}
